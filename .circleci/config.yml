version: 2.1

orbs:
  node: circleci/node@5.2.0 # Use a recent Node orb version

jobs:
  build_and_test: # Job to build, lint, test
    executor: node/default # Use a default Node executor from the orb
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: yarn # Or npm if you use package-lock.json
      # - run: yarn lint # Add linting if configured
      # - run: yarn test # Add tests if configured
      - run: yarn build
      # Persist the built package contents to the workspace
      - run: |
          mkdir -p workspace/package
          # Copy only necessary files for publishing (adjust as needed)
          cp -r dist workspace/package/
          cp package.json README.md LICENSE .npmrc workspace/package/ # Include .npmrc!
      - persist_to_workspace:
          root: workspace
          paths:
            - package

  publish: # Job to publish to npm
    executor: node/default
    steps:
      - attach_workspace:
          at: ~/project # Attach workspace files to ~/project
      - run:
          name: Publish to npm
          # Navigate to the prepared package directory
          # The .npmrc file in this directory uses the NPM_TOKEN env var
          command: |
            cd ~/project/package
            echo "Current directory: $(pwd)"
            ls -la # List files to verify content
            npm publish

workflows:
  version: 2
  build_publish:
    jobs:
      - build_and_test:
          # Filter to run build/test on all tags and specific branches (e.g., main)
          filters:
            tags:
              only: /.*/
            branches:
              only:
                - main # Or your primary branch

      - publish:
          requires:
            - build_and_test
          # Filter to run publish *only* on version tags (e.g., v1.0.0, v1.2.3-beta.4)
          filters:
            tags:
              only: /^v[0-9]+(\.[0-9]+){2}(-.+)?$/
            branches:
              ignore: /.*/ # Do not publish on branch pushes